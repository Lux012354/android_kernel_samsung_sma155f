name: Build KernelSU-Next for SM-A155F

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: kernelsu
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex libssl-dev make libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            python3 wget unzip lz4 tar zip python-is-python3

      - name: Decompress boot.img
        run: |
          lz4 -d boot.img.lz4 boot.img
          echo "boot.img size: $(stat -c%s boot.img) bytes"

      - name: Patch defconfig for KernelSU
        run: |
          ./kernel-5.10/scripts/config \
            --file kernel-5.10/arch/arm64/configs/a15_00_defconfig \
            --set-val UH n \
            --set-val RKP n \
            --set-val KDP n \
            --set-val SECURITY_DEFEX n \
            --set-val INTEGRITY n \
            --set-val FIVE n \
            --set-val TRIM_UNUSED_KSYMS n \
            --set-val PROCA n \
            --set-val PROCA_GKI_10 n \
            --set-val PROCA_S_OS n \
            --set-val PROCA_CERTIFICATES_XATTR n \
            --set-val PROCA_CERT_ENG n \
            --set-val PROCA_CERT_USER n \
            --set-val GAF_V6 n \
            --set-val FIVE_CERT_USER n \
            --set-val FIVE_DEFAULT_HASH n \
            --set-val UH_RKP n \
            --set-val UH_LKMAUTH n \
            --set-val UH_LKM_BLOCK n \
            --set-val RKP_CFP_JOPP n \
            --set-val RKP_CFP n \
            --set-val KDP_CRED n \
            --set-val KDP_NS n \
            --set-val KDP_TEST n \
            --set-val RKP_CRED n \
            --set-val TCP_CONG_BBR y \
            --set-val NET_SCH_FQ y \
            --set-val DEFAULT_BBR y \
            --set-val KSU y

      - name: Setup build environment
        run: |
          mkdir -p out/target/product/a15/obj/KERNEL_OBJ
          sudo apt-get install -y python2 2>/dev/null || true
          cd kernel-5.10
          python2 scripts/gen_build_config.py \
            --kernel-defconfig a15_00_defconfig \
            --kernel-defconfig-overlays "entry_level.config" \
            -m user \
            -o ../out/target/product/a15/obj/KERNEL_OBJ/build.config || \
          sed -i 's/print /print(/g; s/print$/print()/g' scripts/gen_build_config.py && \
          python3 scripts/gen_build_config.py \
            --kernel-defconfig a15_00_defconfig \
            --kernel-defconfig-overlays "entry_level.config" \
            -m user \
            -o ../out/target/product/a15/obj/KERNEL_OBJ/build.config

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_COMPAT="arm-linux-gnueabi-"
          export OUT_DIR="out/target/product/a15/obj/KERNEL_OBJ"
          export DIST_DIR="out/target/product/a15/obj/KERNEL_OBJ"
          export BUILD_CONFIG="out/target/product/a15/obj/KERNEL_OBJ/build.config"
          ./build.sh -j$(nproc)

      - name: Repack boot image
        run: |
          chmod +x scripts/repack
          ./scripts/repack
          echo "Repacked boot.img size: $(stat -c%s boot.img) bytes"

      - name: Upload boot.img as artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-KSU-CYG3
          path: boot.img
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: KSU-CYG3-build-${{ github.run_number }}
          name: "KernelSU-Next A155FXXS7CYG3 - Build #${{ github.run_number }}"
          body: |
            KernelSU-Next kernel build cho SM-A155F
            Firmware: A155FXXS7CYG3
            Build: #${{ github.run_number }}
          files: boot.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

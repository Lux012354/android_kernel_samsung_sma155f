name: Build KernelSU-Next + SUSFS for SM-A155F

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: kernelsu
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex libssl-dev make libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            python3 python2 wget unzip lz4 tar zip \
            python-is-python3 curl
          which python2 || sudo ln -sf /usr/bin/python2.7 /usr/bin/python2 || true

      - name: Decompress boot.img
        run: |
          lz4 -d boot.img.lz4 boot.img
          echo "boot.img size: $(stat -c%s boot.img) bytes"

      - name: Clone SUSFS4KSU
        run: |
          git clone --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            -b gki-android12-5.10
          echo "SUSFS cloned successfully"

      - name: Apply SUSFS kernel patches
        run: |
          # Apply SUSFS patch to kernel source
          cp susfs4ksu/kernel_patches/fs/* kernel-5.10/fs/ 2>/dev/null || true
          cp susfs4ksu/kernel_patches/include/linux/* kernel-5.10/include/linux/ 2>/dev/null || true

          # Apply main SUSFS patch
          cd kernel-5.10
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch \
            --forward --reject-file=/dev/null 2>/dev/null || \
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch \
            --forward 2>/dev/null || true
          cd ..
          echo "SUSFS patches applied"

      - name: Apply KernelSU-Next with SUSFS support
        run: |
          cd kernel-5.10
          # Remove old KSU if exists
          rm -rf drivers/kernelsu

          # Add KernelSU-Next with SUSFS
          curl -LSs \
            "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s next

          # Apply SUSFS patch for KernelSU-Next
          cd ..
          if [ -f susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ]; then
            cd kernel-5.10/drivers/kernelsu
            patch -p3 < ../../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
              --forward 2>/dev/null || true
            cd ../../..
          fi
          echo "KernelSU-Next with SUSFS applied"

      - name: Patch defconfig
        run: |
          ./kernel-5.10/scripts/config \
            --file kernel-5.10/arch/arm64/configs/a15_00_defconfig \
            --set-val UH n \
            --set-val RKP n \
            --set-val KDP n \
            --set-val SECURITY_DEFEX n \
            --set-val INTEGRITY n \
            --set-val FIVE n \
            --set-val TRIM_UNUSED_KSYMS n \
            --set-val PROCA n \
            --set-val PROCA_GKI_10 n \
            --set-val PROCA_S_OS n \
            --set-val PROCA_CERTIFICATES_XATTR n \
            --set-val PROCA_CERT_ENG n \
            --set-val PROCA_CERT_USER n \
            --set-val GAF_V6 n \
            --set-val FIVE_CERT_USER n \
            --set-val FIVE_DEFAULT_HASH n \
            --set-val UH_RKP n \
            --set-val UH_LKMAUTH n \
            --set-val UH_LKM_BLOCK n \
            --set-val RKP_CFP_JOPP n \
            --set-val RKP_CFP n \
            --set-val KDP_CRED n \
            --set-val KDP_NS n \
            --set-val KDP_TEST n \
            --set-val RKP_CRED n \
            --set-val TCP_CONG_BBR y \
            --set-val NET_SCH_FQ y \
            --set-val DEFAULT_BBR y \
            --set-val KSU y \
            --set-val KSU_SUSFS y \
            --set-val KSU_SUSFS_SUS_PATH y \
            --set-val KSU_SUSFS_SUS_MOUNT y \
            --set-val KSU_SUSFS_SUS_KSTAT y \
            --set-val KSU_SUSFS_SUS_OVERLAYFS y \
            --set-val KSU_SUSFS_TRY_UMOUNT y \
            --set-val KSU_SUSFS_SPOOKY_RENAME y \
            --set-val KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT y \
            --set-val KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT y \
            --set-val KSU_SUSFS_ENABLE_LOG y

      - name: Setup build environment
        run: |
          mkdir -p out/target/product/a15/obj/KERNEL_OBJ
          cd kernel-5.10
          python3 scripts/gen_build_config.py \
            --kernel-defconfig a15_00_defconfig \
            --kernel-defconfig-overlays "entry_level.config" \
            -m user \
            -o ../out/target/product/a15/obj/KERNEL_OBJ/build.config

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_COMPAT="arm-linux-gnueabi-"
          export OUT_DIR="out/target/product/a15/obj/KERNEL_OBJ"
          export DIST_DIR="out/target/product/a15/obj/KERNEL_OBJ"
          export BUILD_CONFIG="out/target/product/a15/obj/KERNEL_OBJ/build.config"
          ./build.sh -j$(nproc)

      - name: Repack boot image
        run: |
          chmod +x scripts/repack
          ./scripts/repack
          echo "Final boot.img size: $(stat -c%s boot.img) bytes"

      - name: Upload boot.img as artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-KSU-SUSFS-CYG3
          path: boot.img
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: KSU-SUSFS-CYG3-${{ github.run_number }}
          name: "KernelSU-Next + SUSFS A155FXXS7CYG3 - Build #${{ github.run_number }}"
          body: |
            ✅ KernelSU-Next + SUSFS cho SM-A155F
            📱 Firmware: A155FXXS7CYG3
            🔒 SUSFS: Enabled (ẩn root mức cao)

            Sau khi flash, cài thêm qua KSU Manager:
            - Zygisk Next
            - Shamiko
            - PlayIntegrityFix
          files: boot.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
